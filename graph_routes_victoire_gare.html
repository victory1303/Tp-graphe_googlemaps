    const MARKERS = [{"title": "Rond-point Victoire, Kinshasa, DRC", "coord": {"lat": -4.3531316, "lng": 15.3457561}, "is_major": false, "is_end": false, "is_start": true}, {"title": "March\u00e9 Central, Kinshasa, DRC", "coord": {"lat": -4.3106748, "lng": 15.3127526}, "is_major": true, "is_end": false, "is_start": false}, {"title": "Avenue du 30 Juin & Boulevard du 30 Juin, Kinshasa", "coord": {"lat": -4.3022898, "lng": 15.3137566}, "is_major": true, "is_end": false, "is_start": false}, {"title": "H\u00f4pital G\u00e9n\u00e9ral, Kinshasa, DRC", "coord": {"lat": -4.3089828, "lng": 15.3061773}, "is_major": true, "is_end": false, "is_start": false}, {"title": "Gare Centrale, Kinshasa, DRC", "coord": {"lat": -4.301292699999999, "lng": 15.3179207}, "is_major": false, "is_end": true, "is_start": false}];
    const API_KEY = "AIzaSyAwd1S8sAWIMsxdSvHrkk55v62gf6MlDH8";

    function initMap() {
      const start = MARKERS.find(m => m.is_start).coord;
      const map = new google.maps.Map(document.getElementById('map'), {
        zoom: 13,
        center: start,
        mapTypeId: 'roadmap'
      });

      const bounds = new google.maps.LatLngBounds();
      const destMarker = MARKERS.find(m => m.is_end && m.coord);
      const destLatLng = destMarker ? new google.maps.LatLng(destMarker.coord.lat, destMarker.coord.lng) : null;

      ROUTES.forEach((r, idx) => {
        if (!r.color || !r.poly) return;

        const path = google.maps.geometry.encoding.decodePath(r.poly || "");
        const latLngs = path.map(p => new google.maps.LatLng(p.lat(), p.lng()));

        // TRIM near destination
        let usedLatLngs = latLngs;
        if (destLatLng && latLngs.length > 0) {
          let minIdx = latLngs.length - 1;
          let minDist = Infinity;
          for (let i = 0; i < latLngs.length; i++) {
            const d = google.maps.geometry.spherical.computeDistanceBetween(latLngs[i], destLatLng);
            if (d < minDist) { minDist = d; minIdx = i; }
          }
          usedLatLngs = latLngs.slice(0, Math.min(minIdx + 1, latLngs.length));
          const last = usedLatLngs[usedLatLngs.length - 1];
          if (last && google.maps.geometry.spherical.computeDistanceBetween(last, destLatLng) > 5) {
            usedLatLngs.push(destLatLng);
          }
        }

        const line = new google.maps.Polyline({
          path: usedLatLngs,
          strokeColor: r.color,
          strokeOpacity: 0.95,
          strokeWeight: (r.color === 'blue') ? 8 : 6,
          map: map
        });

        const info = new google.maps.InfoWindow();
        line.addListener('click', (ev) => {
          const content = `<div><b>Trajet ${idx+1}</b><br/>Arrêts: ${r.stops_count}<br/>Distance: ${Math.round(r.distance_m)} m<br/>Durée: ${Math.round(r.duration_s)} s</div>`;
          info.setContent(content);
          info.setPosition(ev.latLng);
          info.open(map);
        });

        usedLatLngs.forEach(p => bounds.extend(p));
      });

      // markers
      MARKERS.forEach(m => {
        if (!m.coord) return;
        let icon = null;
        if (m.is_end) icon = 'http://maps.google.com/mapfiles/ms/icons/green-dot.png';
        else if (m.is_start) icon = 'http://maps.google.com/mapfiles/ms/icons/blue-dot.png';
        else if (m.is_major) icon = 'http://maps.google.com/mapfiles/ms/icons/black-dot.png';
        else icon = 'http://maps.google.com/mapfiles/ms/icons/red-dot.png';

        const marker = new google.maps.Marker({
          position: m.coord,
          map: map,
          title: m.title,
          icon: icon
        });

        const iw = new google.maps.InfoWindow({
          content: `<div><b>${m.title}</b></div>`
        });

        marker.addListener('click', () => iw.open(map, marker));
        bounds.extend(new google.maps.LatLng(m.coord.lat, m.coord.lng));
      });

      map.fitBounds(bounds);

      const legend = document.getElementById('legend');
      legend.innerHTML = `
        <div><b>Légende</b></div>
        <div><img src="http://maps.google.com/mapfiles/ms/icons/blue-dot.png"> Départ (Victoire)</div>
        <div><img src="http://maps.google.com/mapfiles/ms/icons/green-dot.png"> Arrivée (Gare Centrale)</div>
        <div><img src="http://maps.google.com/mapfiles/ms/icons/black-dot.png"> Grand arrêt</div>
        <div style="margin-top:6px"><span style="display:inline-block;width:16px;height:6px;background:blue;margin-right:6px"></span> Trajet  — prioritaire (bleu)</div>
        <div><span style="display:inline-block;width:16px;height:6px;background:yellow;margin-right:6px"></span> Trajet 2 (jaune)</div>
        <div><span style="display:inline-block;width:16px;height:6px;background:purple;margin-right:6px"></span> Trajet 3 (violet)</div>
        <div><span style="display:inline-block;width:16px;height:6px;background:orange;margin-right:6px"></span> Trajet 4 (orange)</div>
      `;
      map.controls[google.maps.ControlPosition.RIGHT_TOP].push(legend);
    }
  </script>
